name: Update profile README

# One self-contained workflow: snake, 3D contributions, summary cards,
# and the custom cards (pixel axolotl, profile card, terminal, pinned repos).

on:
  schedule:
    - cron: "17 */12 * * *"   # twice a day
  workflow_dispatch:           # "Run workflow" button
  push:
    branches: [main]
    paths: [".github/workflows/**", "README*.md"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Contribution snake (pink)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?palette=github-dark&color_snake=#ff79c6&color_dots=#2d333b,#f9d5e5,#f4a7c7,#ec6fa8,#d6337f
            assets/snake-light.svg?color_snake=#d6337f&color_dots=#ebedf0,#f9d5e5,#f4a7c7,#ec6fa8,#d6337f

      - name: 3D chart settings
        run: |
          cat > /tmp/3d-settings.json <<'JSON'
          {
            "type": "normal",
            "backgroundColor": "#0d1117",
            "foregroundColor": "#e6edf3",
            "strongColor": "#ff79c6",
            "weakColor": "#9da7b3",
            "radarColor": "#f1fa8c",
            "growingAnimation": true,
            "contribColors": ["#2d333b", "#f9d5e5", "#f4a7c7", "#ec6fa8", "#d6337f"],
            "fileName": "profile-3d-contrib/profile-pink.svg"
          }
          JSON

      - name: 3D contribution calendar (all preset designs)
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: 3D contribution calendar (custom pink)
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: /tmp/3d-settings.json

      - name: Summary cards (languages, commits per hour, profile details)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 5.5         # IST; change to your timezone
          AUTO_PUSH: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Custom cards
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          DISPLAY_NAME: Jasmine Christopher
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """
          Generates the custom SVG cards for the profile README:

            assets/profile-card.svg   – avatar + name + 4 pastel stat pills
            assets/terminal.svg       – animated "whoami / git status / uptime" terminal
            assets/repos/*.svg        – repo cards for the Pinned section
            assets/header.svg, mascot.svg – original pixel axolotl

          …and rewrites the README blocks between
            <!-- PINNED:START --> / <!-- PINNED:END -->  (README.md and README.ta.md)

          Env:
            GH_TOKEN  – token (the default GITHUB_TOKEN works for public data;
                        use a PAT with read:user to include private contributions)
            GH_USER   – GitHub login
          Run `python generate_cards.py --demo` to render with fake data (no network).
          """
          import base64, datetime as dt, html, json, os, sys, urllib.request
          from pathlib import Path

          ROOT = Path.cwd()
          ASSETS = ROOT / "assets"
          REPOS_DIR = ASSETS / "repos"
          READMES = [ROOT / "README.md", ROOT / "README.ta.md"]

          # ── palette ────────────────────────────────────────────────────────────────
          BG_CARD   = "#1b1a22"
          TERM_BG   = "#2c2a52"
          PINK      = "#ff79c6"
          PROMPT    = "#ff5c7a"
          CMD       = "#f5a3d0"
          CYAN      = "#8be9fd"
          ORANGE    = "#ffb86c"
          LAVENDER  = "#c9b8f5"
          GREEN     = "#50fa7b"
          TEXT      = "#e6edf3"
          MUTED     = "#9da7b3"

          # octicons (MIT)
          ICON = {
              "people": "M2 5.5a3.5 3.5 0 1 1 5.898 2.549 5.508 5.508 0 0 1 3.034 4.084.75.75 0 1 1-1.482.235 4 4 0 0 0-7.9 0 .75.75 0 0 1-1.482-.236A5.507 5.507 0 0 1 3.102 8.05 3.493 3.493 0 0 1 2 5.5ZM11 4a3.001 3.001 0 0 1 2.22 5.018 5.01 5.01 0 0 1 2.56 3.012.749.749 0 0 1-.885.954.752.752 0 0 1-.549-.514 3.507 3.507 0 0 0-2.522-2.372.75.75 0 0 1-.574-.73v-.352a.75.75 0 0 1 .416-.672A1.5 1.5 0 0 0 11 5.5.75.75 0 0 1 11 4Zm-5.5-.5a2 2 0 1 0-.001 3.999A2 2 0 0 0 5.5 3.5Z",
              "repo": "M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z",
              "star": "M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z",
              "fork": "M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a2.25 2.25 0 1 1 1.5 0v.878a2.25 2.25 0 0 1-2.25 2.25h-1.5v2.128a2.251 2.251 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.878a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.75.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm-3 8.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z",
              "commit": "M11.93 8.5a4.002 4.002 0 0 1-7.86 0H.75a.75.75 0 0 1 0-1.5h3.32a4.002 4.002 0 0 1 7.86 0h3.32a.75.75 0 0 1 0 1.5Zm-1.43-.75a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0Z",
          }

          esc = lambda s: html.escape(str(s or ""), quote=True)


          # ── data ───────────────────────────────────────────────────────────────────
          def gql(query, variables, token):
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=json.dumps({"query": query, "variables": variables}).encode(),
                  headers={"Authorization": f"bearer {token}", "User-Agent": "profile-cards"},
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  out = json.load(r)
              if "errors" in out:
                  raise SystemExit(f"GraphQL error: {out['errors']}")
              return out["data"]


          REPO_FIELDS = """
            ... on Repository {
              name nameWithOwner description url stargazerCount forkCount
              primaryLanguage { name color }
            }"""


          def fetch(login, token):
              base = gql(f"""
              query($login:String!) {{
                user(login:$login) {{
                  name login avatarUrl createdAt
                  followers {{ totalCount }}
                  gists {{ totalCount }}
                  pullRequests {{ totalCount }}
                  repositoriesContributedTo(contributionTypes:[COMMIT, PULL_REQUEST, ISSUE, PULL_REQUEST_REVIEW]) {{ totalCount }}
                  contributionsCollection {{ contributionCalendar {{ totalContributions weeks {{ contributionDays {{ date contributionCount }} }} }} }}
                  issues {{ totalCount }}
                  pinnedItems(first:6, types:REPOSITORY) {{ nodes {{ {REPO_FIELDS} }} }}
                }}
              }}""", {"login": login}, token)["user"]

              # stars / forks across all owned, non-fork repos
              stars = forks = repo_count = 0
              cursor = None
              while True:
                  page = gql("""
                  query($login:String!, $after:String) {
                    user(login:$login) {
                      repositories(ownerAffiliations:OWNER, isFork:false, privacy:PUBLIC, first:100, after:$after) {
                        totalCount
                        nodes { stargazerCount forkCount }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }""", {"login": login, "after": cursor}, token)["user"]["repositories"]
                  repo_count = page["totalCount"]
                  for n in page["nodes"]:
                      stars += n["stargazerCount"]; forks += n["forkCount"]
                  if not page["pageInfo"]["hasNextPage"]:
                      break
                  cursor = page["pageInfo"]["endCursor"]

              # all-time commits: one contributionsCollection per year (API max = 1 year)
              created = dt.datetime.fromisoformat(base["createdAt"].replace("Z", "+00:00"))
              now = dt.datetime.now(dt.timezone.utc)
              parts = []
              for y in range(created.year, now.year + 1):
                  start = max(created, dt.datetime(y, 1, 1, tzinfo=dt.timezone.utc))
                  end = min(now, dt.datetime(y, 12, 31, 23, 59, 59, tzinfo=dt.timezone.utc))
                  parts.append(f'y{y}: contributionsCollection(from:"{start.isoformat()}", to:"{end.isoformat()}") '
                               '{ totalCommitContributions restrictedContributionsCount }')
              years = gql(f"query($login:String!){{ user(login:$login){{ {' '.join(parts)} }} }}",
                          {"login": login}, token)["user"]
              commits = sum(v["totalCommitContributions"] + v["restrictedContributionsCount"] for v in years.values())

              try:
                  with urllib.request.urlopen(base["avatarUrl"] + "&s=200", timeout=30) as r:
                      avatar = "data:image/png;base64," + base64.b64encode(r.read()).decode()
              except Exception:
                  avatar = None

              return {
                  "login": base["login"],
                  "name": base["name"] or base["login"],
                  "avatar": avatar,
                  "followers": base["followers"]["totalCount"],
                  "repos": repo_count,
                  "stars": stars,
                  "forks": forks,
                  "commits": commits,
                  "prs": base["pullRequests"]["totalCount"],
                  "issues": base["issues"]["totalCount"],
                  "gists": base["gists"]["totalCount"],
                  "contributed_to": base["repositoriesContributedTo"]["totalCount"],
                  "year_contrib": base["contributionsCollection"]["contributionCalendar"]["totalContributions"],
                  "days": [(d["date"], d["contributionCount"])
                           for w in base["contributionsCollection"]["contributionCalendar"]["weeks"]
                           for d in w["contributionDays"]][-31:],
                  "uptime": (now - created).days,
                  "pinned": [n for n in base["pinnedItems"]["nodes"] if n],
              }


          def demo_data():
              repo = lambda n, d, lang, col, s, f: {"name": n, "nameWithOwner": f"you/{n}", "description": d,
                  "url": "#", "stargazerCount": s, "forkCount": f, "primaryLanguage": {"name": lang, "color": col}}
              return {
                  "login": "your-username", "name": "Your Name", "avatar": None,
                  "followers": 282, "repos": 33, "stars": 1590, "forks": 383, "commits": 12638,
                  "prs": 22, "issues": 0, "gists": 1, "uptime": 1369, "contributed_to": 7, "year_contrib": 290,
                  "days": [(f"2026-10-{i+1:02d}" if i < 31 else "", c) for i, c in enumerate([0,2,5,1,0,0,3,8,12,4,0,1,0,0,6,9,3,2,0,0,0,1,4,7,2,0,0,5,3,1,2])],
                  "pinned": [repo("rag-pipeline", "Retrieval-augmented generation service with hybrid search, reranking and eval harness.", "Python", "#3572A5", 214, 31),
                             repo("agent-runtime", "Lightweight tool-calling agent runtime with tracing.", "TypeScript", "#3178c6", 98, 12)],
              }


          # ── helpers ────────────────────────────────────────────────────────────────
          def kfmt(n):
              if n >= 10000: return f"{n/1000:.1f}k".replace(".0k", "k")
              return str(n)


          def wrap(text, width, lines=2):
              words, out, cur = (text or "No description provided.").split(), [], ""
              for w in words:
                  if len(cur) + len(w) + 1 > width:
                      out.append(cur); cur = w
                      if len(out) == lines: break
                  else:
                      cur = f"{cur} {w}".strip()
              else:
                  out.append(cur)
              out = out[:lines]
              if len(" ".join(out)) < len(text or ""):
                  out[-1] = out[-1].rstrip(".,; ") + "…"
              return out


          def icon(name, x, y, color, size=16):
              s = size / 16
              return f'<path transform="translate({x} {y}) scale({s})" fill="{color}" d="{ICON[name]}"/>'


          # ── profile card ───────────────────────────────────────────────────────────
          def profile_card(d):
              W, H = 1130, 190
              pills = [
                  ("people", d["followers"], "#cfe8fb", "#4aa3e8"),
                  ("repo",   d["repos"],     "#fbd3e6", "#e0457b"),
                  ("star",   d["stars"],     "#fdf0c4", "#e6a817"),
                  ("commit", d["commits"],   "#d3f7d6", "#2fae5b"),
              ]
              avatar = (f'<image href="{d["avatar"]}" x="60" y="50" width="90" height="90" clip-path="url(#av)"/>'
                        if d["avatar"] else f'<circle cx="105" cy="95" r="45" fill="#3b2f5c"/>'
                        f'<text x="105" y="108" text-anchor="middle" font-size="36" fill="{PINK}" font-weight="700">'
                        f'{esc(d["name"][:1].upper())}</text>')
              pill_svg = []
              for i, (ic, val, bg, fg) in enumerate(pills):
                  x = 580 + i * 132
                  pill_svg.append(
                      f'<g class="pill" style="animation-delay:{0.15*i:.2f}s">'
                      f'<rect x="{x}" y="70" width="118" height="50" rx="25" fill="{bg}"/>'
                      f'{icon(ic, x+20, 84, fg, 22)}'
                      f'<text x="{x+50}" y="103" font-size="22" fill="{fg}">{kfmt(val)}</text></g>')
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
          <style>
           .pill {{ opacity:0; animation: up .6s ease-out forwards; }}
           @keyframes up {{ from {{ opacity:0; transform: translateY(8px) }} to {{ opacity:1; transform:none }} }}
          </style>
          <defs><clipPath id="av"><circle cx="105" cy="95" r="45"/></clipPath></defs>
          <rect width="{W}" height="{H}" rx="40" fill="{BG_CARD}"/>
          <circle cx="105" cy="95" r="49" fill="none" stroke="#3d2c63" stroke-width="4"/>
          {avatar}
          <text x="185" y="92" font-size="34" fill="{TEXT}">{esc(d["name"])}</text>
          <text x="185" y="128" font-size="22" fill="{MUTED}">GitHub.com/{esc(d["login"])}</text>
          {"".join(pill_svg)}
          </svg>'''


          # ── terminal card ──────────────────────────────────────────────────────────
          def terminal_card(d):
              W, FS, CW, LH = 800, 21, 12.6, 30          # font size, char width (0.6em), line height
              X0, user = 40, d["login"]
              prompt = f"{user}@git:~$ "
              els, css_delay, y = [], 0.6, 100

              def cmd_line(cmd, y, t):
                  px = X0 + (len(prompt) + 0.5) * CW
                  w = len(cmd) * CW + 4
                  return (f'<g class="show" style="animation-delay:{t:.2f}s">'
                          f'<text x="{X0}" y="{y}" class="prompt">{esc(prompt)}</text>'
                          f'<text x="{px:.1f}" y="{y}" class="cmd">{esc(cmd)}</text>'
                          f'<rect class="cover" x="{px-1:.1f}" y="{y-FS}" width="{w:.1f}" height="{FS+8}" fill="{TERM_BG}" '
                          f'style="animation-delay:{t+0.25:.2f}s;animation-timing-function:steps({len(cmd)})"/></g>'), \
                         t + 0.25 + 0.07 * len(cmd) + 0.25

              def out(svg, t):
                  return f'<g class="show" style="animation-delay:{t:.2f}s">{svg}</g>'

              # whoami
              s, t = cmd_line("whoami", y, css_delay); els.append(s); y += LH
              els.append(out(f'<text x="{X0}" y="{y}" fill="{CYAN}" letter-spacing="4" font-weight="700">{esc(d["name"])}</text>', t))
              y += LH; t += 0.4

              # git status table
              s, t = cmd_line("git status", y, t); els.append(s); y += LH
              rows = [("Stars", d["stars"]), ("Forks", d["forks"]), ("Commits", d["commits"]),
                      ("Followers", d["followers"]), ("Pull Requests", d["prs"]), ("Issues", d["issues"]),
                      ("Repository", d["repos"]), ("Gists", d["gists"])]
              tx, ty, tw, col = X0 + 8, y + 18, 372, 205
              th = 56 + len(rows) * 27 + 14
              table = [f'<text x="{X0+100}" y="{y}" fill="{CMD}" font-style="italic">GitHub Status</text>',
                       f'<rect x="{tx}" y="{ty}" width="{tw}" height="{th}" fill="none" stroke="{PINK}" stroke-width="2"/>',
                       f'<rect x="{tx+5}" y="{ty+5}" width="{tw-10}" height="{th-10}" fill="none" stroke="{PINK}" stroke-width="1.5"/>',
                       f'<line x1="{tx+col}" y1="{ty+5}" x2="{tx+col}" y2="{ty+th-5}" stroke="{PINK}" stroke-width="1.5"/>',
                       f'<line x1="{tx+5}" y1="{ty+50}" x2="{tx+tw-5}" y2="{ty+50}" stroke="{PINK}" stroke-width="1.5"/>',
                       f'<text x="{tx+20}" y="{ty+35}" fill="{ORANGE}" font-weight="700">Title</text>',
                       f'<text x="{tx+col+20}" y="{ty+35}" fill="{ORANGE}" font-weight="700">Count</text>']
              for i, (k, v) in enumerate(rows):
                  ry = ty + 80 + i * 27
                  table.append(f'<text x="{tx+20}" y="{ry}" fill="{LAVENDER}">{k}</text>'
                               f'<text x="{tx+col+20}" y="{ry}" fill="{GREEN}">{v}</text>')
              els.append(out("".join(table), t))
              y = ty + th + 36; t += 0.6

              # uptime
              s, t = cmd_line("uptime", y, t); els.append(s); y += LH
              els.append(out(f'<text x="{X0}" y="{y}" fill="{ORANGE}" font-weight="700">{d["uptime"]}</text>', t))
              y += LH; t += 0.4

              # exit
              s, t = cmd_line("exit", y, t); els.append(s); y += LH
              els.append(out(f'<text x="{X0}" y="{y}" fill="{CMD}">exit</text>', t)); y += LH; t += 0.3
              els.append(out(f'<rect class="cursor" x="{X0}" y="{y-FS+2}" width="12" height="{FS+4}" fill="{PINK}"/>', t))

              H = y + 40
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,'Courier New',monospace" font-size="{FS}">
          <style>
           .prompt {{ fill:{PROMPT}; font-weight:700 }}
           .cmd {{ fill:{CMD} }}
           .show {{ opacity:0; animation: show .01s linear forwards }}
           .cover {{ transform-box: fill-box; transform-origin: right; animation-name: type; animation-duration: .6s; animation-fill-mode: forwards }}
           .cursor {{ animation: blink 1s step-end infinite }}
           @keyframes show {{ to {{ opacity:1 }} }}
           @keyframes type {{ from {{ transform: scaleX(1) }} to {{ transform: scaleX(0) }} }}
           @keyframes blink {{ 50% {{ opacity:0 }} }}
          </style>
          <rect width="{W}" height="{H}" rx="10" fill="{TERM_BG}"/>
          <circle cx="38" cy="38" r="10" fill="#ff4d6d"/><circle cx="70" cy="38" r="10" fill="#f9c06b"/><circle cx="102" cy="38" r="10" fill="#a6e22e"/>
          {"".join(els)}
          </svg>'''


          # ── pixel-art header mascot (original axolotl) ─────────────────────────────
          def pixel_mascot(scale=12):
              W, H = 44, 30
              def in_ell(x, y, cx, cy, rx, ry): return ((x+.5-cx)/rx)**2 + ((y+.5-cy)/ry)**2 <= 1
              body = set()
              for y in range(H):
                  for x in range(W):
                      if in_ell(x, y, 22, 12, 11, 8) or in_ell(x, y, 22, 21, 7, 5.5):
                          body.add((x, y))
              # little arms / feet
              for p in [(14, 21), (15, 21), (14, 22), (29, 21), (30, 21), (30, 22),
                        (17, 26), (18, 26), (18, 27), (26, 26), (27, 26), (26, 27)]:
                  body.add(p)
              # curly tail on the right
              for p in [(29, 23), (30, 23), (31, 23), (32, 22), (33, 21), (33, 20), (32, 19), (31, 20)]:
                  body.add(p)
              gills = set()
              for side in (-1, 1):
                  bx = 22 + side * 11
                  for i, (dy, ln) in enumerate([(-5, 5), (-1, 6), (3, 5)]):
                      for k in range(ln):
                          gx = bx + side * (k + 0)
                          gy = 12 + dy - (k // 2) * (1 if i == 0 else 0) + (k // 2 if i == 2 else 0)
                          gills.add((gx, gy)); gills.add((gx, gy + 1))
              gills -= body
              eyes = {(17, 11), (18, 11), (17, 12), (18, 12), (26, 11), (27, 11), (26, 12), (27, 12)}
              shine = {(17, 11), (26, 11)}
              blush = {(15, 14), (16, 14), (28, 14), (29, 14)}
              mouth = {(21, 15), (23, 15), (22, 16)}
              belly = {(x, y) for (x, y) in body if in_ell(x, y, 22, 22, 4, 3.5)}
              shape = body | gills
              rects = {}
              def put(p, c): rects[p] = c
              for p in shape:
                  x, y = p
                  edge = any((x+dx, y+dy) not in shape for dx, dy in ((1,0),(-1,0),(0,1),(0,-1)))
                  put(p, "#ec6fa8" if p in gills else ("#8a3a62" if edge else "#f9c1d6"))
              for p in belly:
                  if rects.get(p) == "#f9c1d6": put(p, "#fde4ee")
              for p in blush: put(p, "#f27aa6")
              for p in eyes: put(p, "#2b1b2e")
              for p in shine: put(p, "#ffffff")
              for p in mouth: put(p, "#8a3a62")
              px = "".join(f'<rect x="{x*scale}" y="{y*scale}" width="{scale}" height="{scale}" fill="{c}"/>'
                           for (x, y), c in sorted(rects.items()))
              sparkles = "".join(
                  f'<g class="sp" style="animation-delay:{d}s"><rect x="{x*scale}" y="{(y-1)*scale}" width="{scale}" height="{3*scale}" fill="{c}"/>'
                  f'<rect x="{(x-1)*scale}" y="{y*scale}" width="{3*scale}" height="{scale}" fill="{c}"/></g>'
                  for x, y, c, d in [(4, 6, "#f9d5e5", 0), (40, 4, "#c9b8f5", .6), (39, 24, "#fdf0c4", 1.2), (5, 25, "#cfe8fb", .9)])
              w, h = W * scale, (H + 2) * scale
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="{h}" viewBox="0 0 {w} {h}" shape-rendering="crispEdges">
          <style>
           .bob {{ animation: bob 1.2s steps(2) infinite }}
           .sp {{ opacity:0; animation: tw 2.4s steps(1) infinite }}
           @keyframes bob {{ 50% {{ transform: translateY({scale}px) }} }}
           @keyframes tw {{ 0%,60% {{ opacity:0 }} 61%,100% {{ opacity:1 }} }}
          </style>
          {sparkles}<g class="bob">{px}</g>
          </svg>'''


          # ── stats card (omni-style) ────────────────────────────────────────────────
          def stats_card(d):
              W, H = 495, 195
              rows = [("star", "Total Stars Earned", d["stars"]), ("commit", "Total Commits", d["commits"]),
                      ("fork", "Total PRs", d["prs"]), ("people", "Total Issues", d["issues"]),
                      ("repo", "Contributed to", d["contributed_to"])]
              body = []
              for i, (ic, label, val) in enumerate(rows):
                  y = 70 + i * 25
                  body.append(f'<g class="row" style="animation-delay:{0.15 + i*0.12:.2f}s">{icon(ic, 25, y-13, "#e8df7a")}'
                              f'<text x="50" y="{y}" class="lbl">{label}:</text>'
                              f'<text x="230" y="{y}" class="val">{kfmt(val)}</text></g>')
              r, c = 40, 2 * 3.14159 * 40
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
          <style>
           .lbl {{ fill:#e1e1e6; font-size:14px; font-weight:600 }}
           .val {{ fill:#e1e1e6; font-size:14px; font-weight:700 }}
           .row {{ opacity:0; animation: fade .4s ease-in-out forwards }}
           .ring {{ stroke-dasharray:{c:.1f}; stroke-dashoffset:{c:.1f}; animation: ring 1.2s ease-out .3s forwards }}
           @keyframes fade {{ to {{ opacity:1 }} }}
           @keyframes ring {{ to {{ stroke-dashoffset:{c*0.18:.1f} }} }}
          </style>
          <rect x=".5" y=".5" width="{W-1}" height="{H-1}" rx="6" fill="#191622"/>
          <text x="25" y="35" fill="#ff79c6" font-size="18" font-weight="600">{esc(d["name"])}\u2019s GitHub Stats</text>
          {"".join(body)}
          <g transform="translate(400 105)">
            <circle r="{r}" fill="none" stroke="#ff79c6" stroke-opacity=".2" stroke-width="6"/>
            <circle r="{r}" fill="none" stroke="#ff79c6" stroke-width="6" class="ring" transform="rotate(-90)" stroke-linecap="round"/>
            <text y="2" text-anchor="middle" fill="#e8df7a" font-size="22" font-weight="800">{kfmt(d["year_contrib"])}</text>
            <text y="20" text-anchor="middle" fill="#e1e1e6" font-size="10">this year</text>
          </g>
          </svg>'''


          def divider():
              return '''<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="8" viewBox="0 0 1000 8">
          <defs><linearGradient id="g" x1="0" x2="1">
            <stop offset="0" stop-color="#ff79c6"/><stop offset=".5" stop-color="#e8df7a"/><stop offset="1" stop-color="#c9b8f5"/>
            <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4s" repeatCount="indefinite"/>
          </linearGradient></defs>
          <rect y="2" width="1000" height="4" rx="2" fill="url(#g)"/>
          </svg>'''


          # ── activity graph (last 31 days) ─────────────────────────────────────────
          def activity_graph(d):
              W, H, L, R, T, B = 1000, 320, 70, 30, 70, 50
              days = d["days"] or [("", 0)]
              counts = [c for _, c in days]
              top = max(4, max(counts))
              step = max(1, -(-top // 4))
              top = step * 4
              n = len(days)
              X = lambda i: L + i * (W - L - R) / max(1, n - 1)
              Y = lambda v: H - B - v * (H - T - B) / top
              pts = [(X(i), Y(c)) for i, c in enumerate(counts)]
              # smooth curve (Catmull-Rom -> cubic Bezier)
              path = f"M{pts[0][0]:.1f},{pts[0][1]:.1f}"
              for i in range(n - 1):
                  p0, p1, p2 = pts[max(i-1, 0)], pts[i], pts[i+1]
                  p3 = pts[min(i+2, n-1)]
                  c1 = (p1[0] + (p2[0]-p0[0])/6, p1[1] + (p2[1]-p0[1])/6)
                  c2 = (p2[0] - (p3[0]-p1[0])/6, p2[1] - (p3[1]-p1[1])/6)
                  c1 = (c1[0], min(c1[1], H - B)); c2 = (c2[0], min(c2[1], H - B))
                  path += f" C{c1[0]:.1f},{c1[1]:.1f} {c2[0]:.1f},{c2[1]:.1f} {p2[0]:.1f},{p2[1]:.1f}"
              area = path + f" L{pts[-1][0]:.1f},{H-B} L{pts[0][0]:.1f},{H-B} Z"
              grid = "".join(f'<line x1="{L}" x2="{W-R}" y1="{Y(v):.1f}" y2="{Y(v):.1f}" stroke="#ffffff" stroke-opacity=".08"/>'
                             f'<text x="{L-12}" y="{Y(v)+4:.1f}" text-anchor="end" class="ax">{v}</text>'
                             for v in range(0, top + 1, step))
              xl = "".join(f'<text x="{X(i):.1f}" y="{H-B+22}" text-anchor="middle" class="ax">{int(dt_[8:10]) if dt_ else ""}</text>'
                           for i, (dt_, _) in enumerate(days) if i % 2 == 0)
              dots = "".join(f'<circle cx="{x:.1f}" cy="{y:.1f}" r="3.5" fill="#e8df7a"/>' for x, y in pts)
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
          <style>
           .ax {{ fill:#c9c9d1; font-size:12px }}
           .line {{ stroke-dasharray:4000; stroke-dashoffset:4000; animation: draw 2s ease-out forwards }}
           .fill {{ opacity:0; animation: fade 1s ease-out 1.2s forwards }}
           @keyframes draw {{ to {{ stroke-dashoffset:0 }} }}
           @keyframes fade {{ to {{ opacity:1 }} }}
          </style>
          <rect width="{W}" height="{H}" rx="8" fill="#191622"/>
          <text x="{W/2}" y="38" text-anchor="middle" fill="#ff79c6" font-size="20" font-weight="600">{esc(d["name"])}\u2019s Contribution Graph</text>
          {grid}{xl}
          <text x="{W/2}" y="{H-8}" text-anchor="middle" class="ax">Days</text>
          <text x="20" y="{(T+H-B)/2}" text-anchor="middle" class="ax" transform="rotate(-90 20 {(T+H-B)/2})">Contributions</text>
          <path class="fill" d="{area}" fill="#e8df7a" fill-opacity=".18"/>
          <path class="line" d="{path}" fill="none" stroke="#ff79c6" stroke-width="2.5"/>
          <g class="fill">{dots}</g>
          </svg>'''


          # ── repo cards ─────────────────────────────────────────────────────────────
          def repo_card(r):
              W, H = 400, 130
              desc = wrap(r.get("description"), 52)
              lang = r.get("primaryLanguage") or {}
              meta, x = [], 25
              if lang:
                  meta.append(f'<circle cx="{x+6}" cy="106" r="6" fill="{lang.get("color") or MUTED}"/>'
                              f'<text x="{x+18}" y="111" class="m">{esc(lang["name"])}</text>')
                  x += 30 + len(lang["name"]) * 7.5
              meta.append(f'{icon("star", x, 98, MUTED)}<text x="{x+22}" y="111" class="m">{kfmt(r["stargazerCount"])}</text>')
              x += 40 + len(kfmt(r["stargazerCount"])) * 7.5
              meta.append(f'{icon("fork", x, 98, MUTED)}<text x="{x+22}" y="111" class="m">{kfmt(r["forkCount"])}</text>')
              lines = "".join(f'<tspan x="25" dy="{0 if i == 0 else 18}">{esc(l)}</tspan>' for i, l in enumerate(desc))
              title = r["name"] if len(r["name"]) <= 34 else r["name"][:33] + "…"
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
          <style>.m {{ fill:{MUTED}; font-size:13px }}</style>
          <rect x=".5" y=".5" width="{W-1}" height="{H-1}" rx="10" fill="{BG_CARD}" stroke="#3a2f4d"/>
          {icon("repo", 25, 22, PINK)}
          <text x="50" y="35" fill="{PINK}" font-size="17" font-weight="600">{esc(title)}</text>
          <text x="25" y="62" fill="{TEXT}" font-size="13">{lines}</text>
          {"".join(meta)}
          </svg>'''


          def write_repo_section(marker, repos):
              links = []
              for r in repos:
                  fn = r["nameWithOwner"].replace("/", "__") + ".svg"
                  (REPOS_DIR / fn).write_text(repo_card(r))
                  links.append(f'<a href="{r["url"]}"><img src="assets/repos/{fn}" width="49%" alt="{esc(r["name"])}"/></a>')
              block = "\n".join(links) or "<sub>Pin some repos on your profile and they'll show up here.</sub>"
              start, end = f"<!-- {marker}:START -->", f"<!-- {marker}:END -->"
              for readme in READMES:
                  if not readme.exists():
                      continue
                  text = readme.read_text()
                  if start in text and end in text:
                      pre, rest = text.split(start, 1)
                      _, post = rest.split(end, 1)
                      readme.write_text(f"{pre}{start}\n{block}\n{end}{post}")


          def main():
              demo = "--demo" in sys.argv
              d = demo_data() if demo else fetch(os.environ["GH_USER"], os.environ["GH_TOKEN"])
              if os.environ.get("DISPLAY_NAME"):
                  d["name"] = os.environ["DISPLAY_NAME"]
              ASSETS.mkdir(exist_ok=True); REPOS_DIR.mkdir(exist_ok=True)
              (ASSETS / "header.svg").write_text(pixel_mascot(12))
              (ASSETS / "mascot.svg").write_text(pixel_mascot(5))
              (ASSETS / "profile-card.svg").write_text(profile_card(d))
              (ASSETS / "terminal.svg").write_text(terminal_card(d))
              (ASSETS / "stats.svg").write_text(stats_card(d))
              (ASSETS / "divider.svg").write_text(divider())
              (ASSETS / "activity.svg").write_text(activity_graph(d))
              if demo:
                  for r in d["pinned"]:
                      (REPOS_DIR / (r["nameWithOwner"].replace("/", "__") + ".svg")).write_text(repo_card(r))
              else:
                  write_repo_section("PINNED", d["pinned"])
              print(json.dumps({k: v for k, v in d.items() if k not in ("avatar", "pinned")}, indent=1))


          if __name__ == "__main__":
              main()
          PY

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile cards"
          file_pattern: "README.md README.ta.md assets/** profile-3d-contrib/** profile-summary-card-output/**"
