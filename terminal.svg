<svg xmlns="http://www.w3.org/2000/svg" width="800" height="690" viewBox="0 0 800 690" font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,'Courier New',monospace" font-size="21">
<style>
 .prompt { fill:#ff5c7a; font-weight:700 }
 .cmd { fill:#f5a3d0 }
 .show { opacity:0; animation: show .01s linear forwards }
 .cover { transform-box: fill-box; transform-origin: right; animation-name: type; animation-duration: .6s; animation-fill-mode: forwards }
 .cursor { animation: blink 1s step-end infinite }
 @keyframes show { to { opacity:1 } }
 @keyframes type { from { transform: scaleX(1) } to { transform: scaleX(0) } }
 @keyframes blink { 50% { opacity:0 } }
</style>
<rect width="800" height="690" rx="10" fill="#2c2a52"/>
<circle cx="38" cy="38" r="10" fill="#ff4d6d"/><circle cx="70" cy="38" r="10" fill="#f9c06b"/><circle cx="102" cy="38" r="10" fill="#a6e22e"/>
