xt x="273" y="450" fill="#50fa7b">33</text><text x="68" y="477" fill="#c9b8f5">Gists</text><text x="273" y="477" fill="#50fa7b">1</text></g><g class="show" style="animation-delay:3.72s"><text x="40" y="530" class="prompt">your-username@git:~$ </text><text x="310.9" y="530" class="cmd">uptime</text><rect class="cover" x="309.9" y="509" width="79.6" height="29" fill="#2c2a52" style="animation-delay:3.97s;animation-timing-function:steps(6)"/></g><g class="show" style="animation-delay:4.64s"><text x="40" y="560" fill="#ffb86c" font-weight="700">1369</text></g><g class="show" style="animation-delay:5.04s"><text x="40" y="590" class="prompt">your-username@git:~$ </text><text x="310.9" y="590" class="cmd">exit</text><rect class="cover" x="309.9" y="569" width="54.4" height="29" fill="#2c2a52" style="animation-delay:5.29s;animation-timing-function:steps(4)"/></g><g class="show" style="animation-delay:5.82s"><text x="40" y="620" fill="#f5a3d0">exit</text></g><g class="show" style="animation-delay:6.12s"><rect class="cursor" x="40" y="631" width="12" height="25" fill="#ff79c6"/></g>
</svg>